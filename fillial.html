<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filial</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #eee;
}

.container {
  max-width: 400px;
  margin: auto;
  background: #f5f5f5;
  min-height: 100vh;
}

.header {
  display: flex;
  justify-content: space-between;
  padding: 16px;
  font-weight: 600;
  background: white;
}

.image {
  margin: 10px 16px;
  border-radius: 20px;
  overflow: hidden;
}

.image img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.fwahhs {
  text-align: center;
}

.fwahhs span {
  width: 6px;
  height: 6px;
  background: #ccc;
  display: inline-block;
  border-radius: 50%;
  margin: 0 3px;
}

.fwahhs .active {
  background: #1976D2;
}

.title {
  padding: 10px 16px;
}

.title h2 {
  margin: 0;
}

.title p {
  color: #777;
  font-size: 14px;
}

.card {
  background: white;
  margin: 10px 16px;
  padding: 12px;
  border-radius: 16px;
  display: flex;
  gap: 10px;
  align-items: center;
}

.schedule {
  background: white;
  margin: 10px 16px;
  padding: 12px;
  border-radius: 16px;
  font-size: 14px;
}

.row {
  display: flex;
  justify-content: space-between;
  margin: 5px 0;
}

.red {
  color: red;
}

.map {
  margin: 16px;
}

.map iframe {
  width: 100%;
  height: 140px;
  border-radius: 16px;
  border: none;
}

.button {
  margin: 16px;
  background: #1976D2;
  color: white;
  padding: 14px;
  text-align: center;
  border-radius: 14px;
  box-shadow: 50px 50px 100px rgba(23, 62, 204, 0.1);
}
.button:hover {
    color: #1976D2;
    background: white;
    transition: all 0.3s ease;
    box-shadow: 5px 5px 15px rgba(23, 62, 204, 0.2);
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <i class="fa-solid fa-arrow-left"></i>
    <span>Filial tafsilotlari</span>
    <i class="fa-solid fa-share-nodes"></i>
  </div>

  <div class="image">
    <img src="https://picsum.photos/400/200">
  </div>

  <div class="fwahhs">
    <span class="active"></span>
    <span></span>
    <span></span>
  </div>

  <div class="title">
    <h2>Samarqand Filiali</h2>
    <p>Mijozlarimizga yuqori sifatli xizmat ko'rsatuvchi
asosiy mintaqaviy markazimiz.</p>
  </div>

  <div class="card">
    <i class="fa-solid fa-location-dot"></i>
    <div>Samarqand shahri, Registon ko‘chasi</div>
  </div>

  <div class="card">
    <i class="fa-solid fa-phone"></i>
    <div>+998 66 123 45 67</div>
  </div>

  <div class="schedule">
    <b>Ish tartibi</b>
    <div class="row"><span>Dushanba - Juma</span><span>09:00 - 18:00</span></div>
    <div class="row"><span>Shanba</span><span>10:00 - 15:00</span></div>
    <div class="row"><span>Yakshanba</span><span class="red">Dam olish</span></div>
  </div>

  <div class="map">
    <iframe src="https://www.google.com/maps?q=samarkand&output=embed"></iframe>
  </div>

  <div class="button">
    <i class="fa-solid fa-map"></i> Google xaritada ochish
  </div>

</div>

</body>
</html>
