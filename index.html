<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filiallar Xaritasi</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue: #1976D2;
  --white: #fff;
  --gray: #9E9E9E;
}

body {
  font-family: 'Inter', sans-serif;
}

/* Container */
.phone {
  width: 100%;
  height: 100vh;
  position: relative;
}

/* Map */
.frame {
  width: 100%;
  height: 100%;
  border: none;
}

/* Top bar */
.top-bar {
  position: absolute;
  top: 10px;
  left: 0;
  right: 0;
  padding: 0 16px;
}

.search-row {
  display: flex;
  align-items: center;
  background: white;
  border-radius: 12px;
  padding: 10px;
  gap: 10px;
}

.search-input {
  flex: 1;
  border: none;
  outline: none;
}

/* Filter buttons */
.chip-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.chip {
  padding: 6px 14px;
  border-radius: 20px;
  background: white;
  font-size: 13px;
  cursor: pointer;
}

.chip.active {
  background: var(--blue);
  color: white;
}

/* Bottom nav */
.bottom-nav {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: white;
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
}

.nav-item {
  text-align: center;
  font-size: 12px;
  color: var(--gray);
}

.nav-item.active {
  color: var(--blue);
}
</style>
</head>

<body>

<div class="phone">

  <!-- Map -->
  <iframe class="frame" src="https://www.google.com/maps?q=Andijan&output=embed"></iframe>

  <!-- Top -->
  <div class="top-bar">
    <div class="search-row">
      <i class="fa-solid fa-arrow-left"></i>
      <input class="search-input" placeholder="Filialni izlash">
      <i class="fa-solid fa-filter"></i>
    </div>

    <div class="chip-row">
      <div class="chip active">Barchasi</div>
      <div class="chip">O'zbekiston</div>
      <div class="chip">Qirg'iziston</div>
    </div>
  </div>

  <!-- Bottom -->
  <div class="bottom-nav">
    <div class="nav-item"><i class="fa-solid fa-house"></i><br>Asosiy</div>
    <div class="nav-item active"><i class="fa-solid fa-location-arrow"></i><br>Filiallar</div>
    <div class="nav-item"><i class="fa-solid fa-bars"></i><br>To'lovlar</div>
    <div class="nav-item"><i class="fa-solid fa-user"></i><br>Profil</div>
  </div>

</div>

</body>
</html>
