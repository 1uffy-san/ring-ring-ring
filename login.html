<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #eee;
}

.container {
  max-width: 400px;
  margin: auto;
  min-height: 100vh;
  padding: 20px 16px;
}

.logo {
  width: 70px;
  height: 70px;
  background: #1976D2;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 40px auto 15px;
  color: white;
  font-size: 24px;
}

.title {
  text-align: center;
}

.title h2 {
  margin: 5px 0;
}

.title p {
  color: #777;
  font-size: 14px;
}

.card {
  background: white;
  margin-top: 20px;
  padding: 16px;
  border-radius: 16px;
}

.label {
  font-size: 14px;
  margin: 10px 0 5px;
}

.input {
  width: 90%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #ddd;
  outline: none;
  background-color: #eee;
  margin-bottom: 10px;
}

.row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 10px;
}

.btn {
  background: #1976D2;
  color: white;
  padding: 14px;
  border-radius: 14px;
  text-align: center;
  margin-top: 10px;
  cursor: pointer;
}

.bottom-box {
  background: #e9eef3;
  margin-top: 20px;
  padding: 20px;
  border-radius: 16px;
  text-align: center;
  color: #666;
  font-size: 14px;
}

.fwaah {
    width: 100%;
    height: 200px;
}

.helpp {
    color: #1976D2;
}
.line {
    height: 2px;
    background: #eee;
    margin: 20px auto;
    width: 80%;
}
.ask {
    text-align: center;
}
.tillar {
    width: 100%;
    /* position: absolute; */
    /* bottom: 0; */
    margin: 30px 0 0 0 ;
    background-color: white;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <i class="fa-solid fa-location-dot"></i>
  </div>

  <div class="title">
    <h2>Filiallar Boshqaruvi</h2>
    <p>Admin paneliga kirish</p>
  </div>

  <div class="card">

    <div class="label">Foydalanuvchi nomi yoki Email</div>
    <input class="input" placeholder="example@mail.com">

    <div class="row">
      <span>Parol</span>
    </div>

    <input class="input" type="password" placeholder="********">

    <div class="row">
      <label><input type="checkbox"> Meni eslab qol</label>
    </div>

    <div class="btn">Kirish</div>

    <div class="line">

    </div>

    <div class="ask">
        Yordam kerakmi?
<span class="helpp">Qo'llab-quvvatlash</span>
    </div>

  </div>

  <div class="bottom-box">
    Barcha filiallar manzillari bitta joyda
  </div>
  <iframe class="fwaah" src="https://www.google.com/maps?q=samarkand&output=embed" frameborder="0"></iframe>


  <div class="tillar">
    qirGiz tili <i class="fa-solid fa-arrow-bottom"></i>
  </div>
</div>

</body>
</html>
