<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filiallar ro'yxati</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #e8eaf0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  }

  .phone-wrap {
    width: 375px;
    min-height: 780px;
    background: #f2f3f7;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .top-bar {
    background: #fff;
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .top-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn-back {
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
    font-size: 18px;
  }

  .page-title {
    font-size: 17px;
    font-weight: 700;
    color: #1a1a2e;
    line-height: 1.2;
  }

  .btn-add {
    background: #3b82f6;
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1.3;
    text-align: left;
  }

  .search-wrap {
    background: #fff;
    padding: 10px 20px 14px;
  }

  .search-box {
    background: #f2f3f7;
    border-radius: 12px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .search-box i { color: #9ca3af; font-size: 14px; }

  .search-box input {
    border: none;
    background: transparent;
    font-size: 14px;
    color: #6b7280;
    outline: none;
    width: 100%;
  }

  .stat-list {
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .stat-card {
    background: #fff;
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }

  .stat-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .stat-icon.blue  { background: #eff6ff; color: #3b82f6; }
  .stat-icon.green { background: #f0fdf4; color: #22c55e; }
  .stat-icon.amber { background: #fffbeb; color: #f59e0b; }

  .stat-info { display: flex; flex-direction: column; }

  .stat-info .lbl {
    font-size: 12px;
    color: #9ca3af;
    margin-bottom: 2px;
  }

  .stat-info .val {
    font-size: 18px;
    font-weight: 700;
    color: #1a1a2e;
  }

  .table-wrap {
    flex: 1;
    padding: 12px 16px 80px;
  }

  .data-table {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }

  .col-head {
    display: grid;
    grid-template-columns: 1fr 1fr 60px;
    padding: 10px 16px;
    border-bottom: 1px solid #f2f3f7;
  }

  .col-head span {
    font-size: 12px;
    font-weight: 600;
    color: #9ca3af;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .data-row {
    display: grid;
    grid-template-columns: 1fr 1fr 60px;
    padding: 14px 16px;
    align-items: center;
    border-bottom: 1px solid #f9fafb;
  }

  .data-row:last-child { border-bottom: none; }

  .branch-name {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .branch-name i { color: #3b82f6; font-size: 14px; }

  .branch-name span {
    font-size: 20px;
    font-weight: 600;
    color: #1a1a2e;
    line-height: 1.8;
  }

  .country-cell {
    font-size: 13px;
    color: #6b7280;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge.open   { background: #f0fdf4; color: #16a34a; }
  .badge.closed { background: #fffbeb; color: #d97706; }
  .badge i { font-size: 6px; }

  .nav-bar {
    background: #fff;
    border-top: 1px solid #e5e7eb;
    padding: 8px 0 16px;
    display: flex;
    justify-content: space-around;
    margin-top: auto;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 16px;
    cursor: pointer;
    color: #9ca3af;
    text-decoration: none;
  }

  .nav-item i { font-size: 20px; }
  .nav-item span { font-size: 10px; font-weight: 500; }
  .nav-item.active { color: #3b82f6; }
</style>
</head>
<body>
<div class="phone-wrap">

  <div class="top-bar">
    <div class="top-left">
      <button class="btn-back"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="page-title">Filiallar<br>ro'yxati</div>
    </div>
    <button class="btn-add">
      <i class="fa-solid fa-plus"></i>
      Yangi filial<br>qo'shish
    </button>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Filial nomi, shahar yoki telefon bo'yicha qidirish...">
    </div>
  </div>

  <div class="stat-list">
    <div class="stat-card">
      <div class="stat-icon blue"><i class="fa-solid fa-store"></i></div>
      <div class="stat-info">
        <span class="lbl">Jami filiallar</span>
        <span class="val">24 ta</span>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green"><i class="fa-solid fa-circle-check"></i></div>
      <div class="stat-info">
        <span class="lbl">Faol</span>
        <span class="val">22 ta</span>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber"><i class="fa-solid fa-circle-pause"></i></div>
      <div class="stat-info">
        <span class="lbl">Vaqtincha yopiq</span>
        <span class="val">2 ta</span>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <div class="data-table">
      <div class="col-head">
        <span>Filial Nomi</span>
        <span>Davlat</span>
        <span>S</span>
      </div>
      <div class="data-row">
        <div class="branch-name">
          <i class="fa-solid fa-location-dot"></i>
          <span>Toshkent<br>Markaziy</span>
        </div>
        <div class="country-cell">O'zbekiston</div>
        <div class="badge open"><i class="fa-solid fa-circle"></i>T</div>
      </div>
      <div class="data-row">
        <div class="branch-name">
          <i class="fa-solid fa-location-dot"></i>
          <span>Samarqand<br>Registon</span>
        </div>
        <div class="country-cell">O'zbekiston</div>
        <div class="badge closed"><i class="fa-solid fa-circle"></i>S</div>
      </div>
    </div>
  </div>

  <div class="nav-bar">
    <a class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span>Asosiy</span>
    </a>
    <a class="nav-item active">
      <i class="fa-solid fa-shop"></i>
      <span>Filiallar</span>
    </a>
    <a class="nav-item">
      <i class="fa-solid fa-chart-bar"></i>
      <span>Statistika</span>
    </a>
    <a class="nav-item">
      <i class="fa-solid fa-gear"></i>
      <span>Sozlamalar</span>
    </a>
  </div>

</div>
</body>
</html>
