<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filiallar ro'yxati</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #e8eaf0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
      }

      .phone-wrap {
        width: 375px;
        min-height: 780px;
        background: #f2f3f7;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .top-bar {
        background: #fff;
        padding: 16px 20px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .top-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .btn-back {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: #333;
        background: transparent;
        border: none;
      }

      .page-title {
        font-size: 17px;
        font-weight: 700;
        color: #1a1a2e;
        line-height: 1.2;
      }

      .btn-add {
        background: #3b82f6;
        color: #fff;
        border: none;
        border-radius: 14px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 600;
        display: flex;
        gap: 6px;
      }

      .search-wrap {
        background: #fff;
        padding: 10px 20px 14px;
      }

      .search-box {
        background: #f2f3f7;
        border-radius: 12px;
        padding: 10px 14px;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 14px;
        color: #6b7280;
      }

      .stat-list {
        padding: 10px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .stat-card {
        background: #fff;
        border-radius: 16px;
        padding: 14px 16px;
        display: flex;
        gap: 14px;
        align-items: center;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
      }

      .stat-icon {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        font-size: 20px;
      }

      .stat-icon.blue {
        background: #eff6ff;
        color: #3b82f6;
      }
      .stat-icon.green {
        background: #f0fdf4;
        color: #22c55e;
      }
      .stat-icon.amber {
        background: #fffbeb;
        color: #f59e0b;
      }

      .stat-info {
        display: flex;
        flex-direction: column;
      }

      .stat-info .lbl {
        font-size: 12px;
        color: #9ca3af;
      }
      .stat-info .val {
        font-size: 18px;
        font-weight: 700;
        color: #1a1a2e;
      }

      .table-wrap {
        width: 500px;
        padding: 12px 16px 80px;
      }

      .data-table {
        background: #fff;
        height: 500px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
      }

      .col-head {
        display: grid;
        grid-template-columns: 1fr 1fr 60px;
        padding: 10px 16px;
        border-bottom: 1px solid #f2f3f7;
      }

      .col-head span {
        font-size: 12px;
        font-weight: 600;
        color: #9ca3af;
      }

      .data-row {
        display: grid;
        grid-template-columns: 1fr 1fr 60px;
        padding: 14px 16px;
        align-items: center;
        border-bottom: 1px solid #f9fafb;
      }

      .branch-name {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .branch-name span {
        font-size: 20px;
        font-weight: 600;
        color: #1a1a2e;
        line-height: 1.8;
      }

      .country-cell {
        font-size: 19px;
        color: #6b7280;
      }

      .badge {
        display: inline-flex;
        gap: 4px;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
      }

      .badge.open {
        background: #f0fdf4;
        color: #16a34a;
      }
      .badge.closed {
        background: #fffbeb;
        color: #d97706;
      }

      .nav-bar {
        background: #fff;
        border-top: 1px solid #e5e7eb;
        padding: 8px 0 16px;
        display: flex;
        justify-content: space-around;
        margin-top: auto;
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        color: #9ca3af;
        text-decoration: none;
      }

      .nav-item i {
        font-size: 20px;
      }
      .nav-item span {
        font-size: 10px;
      }

      .nav-item.active {
        color: #3b82f6;
      }

      /* random classes added */

      .koe {
        letter-spacing: 0.2px;
      }
      .wiqhi {
        transform: translateY(0);
      }
      .schyea {
        opacity: 1;
      }
      .hgew {
        filter: blur(0);
      }
      .local {
        outline: none;
      }
      .nude {
        border: 0;
      }
      .fwwwwwwwaaaaaaahhh {
        box-shadow: none;
      }
      .exxx {
        transition: 0.2s;
      }
      .uisd {

      }
      .dasturchi {
        cursor: default;
      }
      .hhw {
        white-space: normal;
      }
      .WWe {
        display: block;
      }
      .xz {
        position: relative;
      }
      .huahua {
        z-index: 1;
      }
    </style>
  </head>
